<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F3F4F6;color:#111}
.hd{background:linear-gradient(135deg,#1E3A5F,#0F2439);padding:14px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.tabs{background:#fff;border-bottom:2px solid #E5E7EB;padding:0 20px;display:flex}
.tab{padding:11px 18px;background:0;border:0;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;color:#888;display:flex;align-items:center;gap:5px}
.tab.on{border-bottom-color:#4F46E5;font-weight:700;color:#111}
.tbg{background:#4F46E5;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
.tbg.so{background:#8B5CF6}.tbg.ad{background:#D97706}
.subtabs{background:#F9FAFB;padding:0 20px;display:flex;border-bottom:1px solid #E5E7EB}
.subtab{padding:8px 16px;background:0;border:0;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;color:#888}
.subtab.on{border-bottom-color:#8B5CF6;font-weight:700;color:#8B5CF6}
.subtab.ad.on{border-bottom-color:#D97706;color:#D97706}
.sts{padding:10px 20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid #E5E7EB;position:relative;overflow:hidden;cursor:pointer;text-align:center}
.st.on{background:var(--ac);border:2px solid var(--ac)}
.st::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac)}
.sl{font-size:10px;color:#6B7280;font-weight:600;text-transform:uppercase;margin-bottom:2px}
.st.on .sl{color:rgba(255,255,255,.8)}
.sv{font-size:13px;font-weight:700;color:#6B7280;margin-bottom:2px}.st.on .sv{color:rgba(255,255,255,.8)}
.sa{font-size:24px;font-weight:800;line-height:1.1;color:#111}.st.on .sa{color:#fff}
.sh2{font-size:12px;font-weight:600;margin-top:3px;color:#9CA3AF}.st.on .sh2{color:rgba(255,255,255,.7)}
.fb{margin:8px 20px 0;background:#fff;border-radius:8px;border:1px solid #E5E7EB;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.fg label{font-size:9px;font-weight:600;color:#999;display:block;text-transform:uppercase}
.fg select{padding:6px 10px;border-radius:6px;border:1px solid #D1D5DB;background:#fff;font-size:12px;cursor:pointer;font-family:inherit}
.fg select.af{border-color:#4F46E5;background:#EEF2FF}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 6px;text-align:left;font-size:9px;font-weight:700;color:#6B7280;text-transform:uppercase;background:#F9FAFB;border-bottom:2px solid #E5E7EB;white-space:nowrap;cursor:pointer;user-select:none;position:relative}
th:hover{color:#4F46E5;background:#EEF2FF}
th .resizer{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;background:transparent}
th .resizer:hover,th .resizer.resizing{background:#4F46E5}
td{padding:9px 6px;vertical-align:middle}
tr{border-bottom:1px solid #F3F4F6}tr:nth-child(even){background:#FAFAFA}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:16px;font-size:10px;font-weight:600}
.ab{width:26px;height:26px;border-radius:6px;border:0;cursor:pointer;font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.el{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;display:none}.ov.open{display:block}
.sb{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:100vw;background:#fff;overflow-y:auto;box-shadow:-6px 0 30px rgba(0,0,0,.12);z-index:1001}
.adj{background:#fff;border-radius:10px;border:1px solid #E5E7EB;padding:14px;margin-top:10px}
.adjbar{position:relative;height:26px;border-radius:7px;overflow:hidden;margin-bottom:6px}
.adjfill{position:absolute;top:0;bottom:0;left:0;border-radius:7px;background:linear-gradient(90deg,#10B981,#34D399);transition:width .3s}
.adjtx{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.toast{position:fixed;top:14px;right:14px;z-index:9999;padding:10px 20px;border-radius:8px;color:#fff;font-size:13px;font-weight:600;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.show{display:block}
.ldr{display:flex;align-items:center;justify-content:center;padding:60px;color:#6B7280;font-size:14px;flex-direction:column;gap:12px}
.spin{width:28px;height:28px;border:3px solid #E5E7EB;border-top-color:#4F46E5;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.login{background:#0F1117;min-height:100vh;display:flex;align-items:center;justify-content:center}
.lbox{background:#1A1D27;border-radius:18px;padding:36px 32px;width:380px;max-width:90vw;border:1px solid #2A2D3A;text-align:center}
.lbox h1{color:#F9FAFB;font-size:20px;margin-bottom:4px}
.lbox p{color:#6B7280;font-size:12px;margin-bottom:4px}
.msbtn{width:100%;padding:12px;border-radius:10px;border:1px solid #2A2D3A;background:#1E2030;color:#E5E7EB;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.px{padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;display:inline-block}
.umenu{position:relative;cursor:pointer}
.umenu:hover .udrop{display:block}
.udrop{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #E5E7EB;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:180px;z-index:100;overflow:hidden}
.udrop a{display:block;padding:10px 14px;color:#111;font-size:12px;text-decoration:none;border-bottom:1px solid #F3F4F6}
.udrop a:hover{background:#F3F4F6}
.udrop a:last-child{border:0;color:#DC2626}
.cmtsb{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:100vw;background:#fff;overflow:hidden;box-shadow:-6px 0 30px rgba(0,0,0,.12);z-index:1002;display:none;flex-direction:column}
.cmtbub{padding:10px 14px;border-radius:12px;margin-bottom:8px;font-size:12px;max-width:85%}
.cmtbub.me{background:#EEF2FF;margin-left:auto;border-bottom-right-radius:4px}
.cmtbub.them{background:#F3F4F6;margin-right:auto;border-bottom-left-radius:4px}
.notif-panel{position:fixed;right:60px;top:50px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);width:360px;max-height:400px;overflow-y:auto;z-index:200}
.sn-btn{position:relative;background:linear-gradient(135deg,#F59E0B,#D97706);border:0;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
.sn-badge{position:absolute;top:-6px;right:-6px;background:#EF4444;color:#fff;font-size:9px;font-weight:700;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.aprbdg{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.cbtn{background:#F3F4F6;border:1px solid #E5E7EB;border-radius:6px;padding:2px 6px;cursor:pointer;font-size:11px;color:#6B7280;display:inline-flex;align-items:center;gap:3px;line-height:1}
.cbtn.has{background:#EDE9FE;border-color:#8B5CF6;color:#6D28D9}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:20px;width:340px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.2)}
</style>
</head>

function fmtT(v){if(!v)return'';const s=String(v);if(s.includes(':'))return s.substring(0,5);const f=parseFloat(v);if(!isNaN(f)&&f<1){const m=Math.round(f*1440);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}return s.substring(0,5)}
function fmtDT(v){if(!v)return'';const s=String(v);const n=parseFloat(v);if(!isNaN(n)&&n>30000&&n<100000){const d=new Date((n-25569)*86400000);return d.toISOString().substring(0,10)+' '+d.toISOString().substring(11,16)}if(s.match(/^\d{4}-\d{2}/)){return s.substring(0,10)+(s.length>16?' '+s.substring(11,16):'')}return s.substring(0,16)}

async function reassign(it,newName){

// FILTERING
function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function isMe(val){if(!val)return false;const v=norm(val),n=norm(usr),m=norm(usrMail.split('@')[0].replace(/\./g,' '));return v===n||v===m||n.includes(v)||v.includes(n)||(m&&(v.includes(m)||m.includes(v)))}
function curTab(){return S.tab==='signoff'?S.soTab:(S.tab==='admin'?S.adTab:S.tab)}
function myD(){
  const t=curTab(),isH=t==='hours',isB=t==='budel';
  if(S.tab==='signoff')return isH?S.hrs.filter(d=>(d.st==='Approved'||d.st==='Adjusted')&&d.sb):isB?S.bud.filter(d=>(d.st==='Approved'||d.st==='Adjusted')&&d.sb):S.pos.filter(d=>(d.st==='Approved'||d.st==='Adjusted')&&d.sb);
  if(S.tab==='admin')return isH?[...S.hrs]:isB?[...S.bud]:[...S.pos];
  if(isAdmin)return isH?[...S.hrs]:isB?[...S.bud]:[...S.pos];
  return isH?S.hrs.filter(d=>isMe(d.AF)):isB?S.bud.filter(d=>isMe(d.AF)):S.pos.filter(d=>isMe(d.OB));
}
function eS(){return S.sf||S.f.st}
function getF(){
  let d=myD(),f=S.f,es=eS();const t=curTab(),isH=t==='hours',isB=t==='budel',isHB=isH||isB;
  if(es!=='All'){if(es==='Approved')d=d.filter(x=>x.st==='Approved'||x.st==='Adjusted');else if(es==='_await')d=d.filter(x=>x.fs!=='Confirmed');else if(es==='Confirmed')d=d.filter(x=>x.fs==='Confirmed');else d=d.filter(x=>x.st===es)}
  if(f.cmt)d=d.filter(x=>hasComments(x.I));
  if(f.apr!=='All')d=d.filter(x=>(isHB?x.AF:x.OB)===f.apr||x.sb===f.apr);
  if(isHB){
    if(f.mo!=='All')d=d.filter(x=>x.D&&x.D.startsWith(f.mo));
    if(f.co!=='All')d=d.filter(x=>(x.X||'')===(f.co==='None'?'':f.co));
    if(f.cd!=='All')d=d.filter(x=>(x.C||'--')===f.cd);
    if(f.em!=='All')d=d.filter(x=>x.E===f.em);
    if(f.pr!=='All')d=d.filter(x=>x.M===f.pr);
    if(f.sp!=='All')d=d.filter(x=>(x.B||'--')===f.sp);
  }else{
    if(f.co!=='All')d=d.filter(x=>x.Z===f.co);
    if(f.cd!=='All')d=d.filter(x=>x.PN===f.cd);
    if(f.em!=='All')d=d.filter(x=>x.G===f.em);
    if(f.pr!=='All')d=d.filter(x=>x.J===f.pr);
    if(f.sp!=='All')d=d.filter(x=>(x.SD||'--')===f.sp);
  }
  return d.sort((a,b)=>{const k=S.sortK,dir=S.sortD==='asc'?1:-1;let av=a[k],bv=b[k];if(av==null)av='';if(bv==null)bv='';if(typeof av==='number'&&typeof bv==='number')return(av-bv)*dir;return String(av).localeCompare(String(bv))*dir});
}
function fO(k){
  let d=myD();const t=curTab(),isH=t==='hours',isB=t==='budel',isHB=isH||isB;
  if(k==='apr'){const fld=isHB?'AF':'OB';return[...new Set(d.map(x=>x[fld]).filter(Boolean))].sort()}
  if(isHB){
    if(k==='co')return[...new Set(d.map(x=>x.X||''))].sort();
    if(k==='cd')return[...new Set(d.map(x=>x.C||'--'))].sort();
    if(k==='em')return[...new Set(d.map(x=>x.E))].sort();
    if(k==='pr')return[...new Set(d.map(x=>x.M))].sort();
    if(k==='sp'){if(S.f.cd!=='All')d=d.filter(x=>(x.C||'--')===S.f.cd);else if(S.f.pr!=='All')d=d.filter(x=>x.M===S.f.pr);return[...new Set(d.map(x=>x.B||'--'))].sort()}
    if(k==='mo'){const s=new Set();d.forEach(x=>{if(x.D){const p=x.D.split('-');if(p.length>=2)s.add(p[0]+'-'+p[1])}});return[...s].sort().map(y=>{const p=y.split('-');return{v:y,l:MS[+p[1]-1]+' '+p[0]}})}
  }else{
    if(k==='co')return[...new Set(d.map(x=>x.Z))].sort();
    if(k==='cd')return[...new Set(d.map(x=>x.PN))].sort();
    if(k==='em')return[...new Set(d.map(x=>x.G))].sort();
    if(k==='pr')return[...new Set(d.map(x=>x.J))].sort();
    if(k==='sp'){if(S.f.cd!=='All')d=d.filter(x=>x.PN===S.f.cd);else if(S.f.pr!=='All')d=d.filter(x=>x.J===S.f.pr);return[...new Set(d.map(x=>x.SD||'--'))].sort()}
  }
  return[];
}

async function sendDigest(){
  if(!isFinal&&!isSenior){toast('Only admins can send digest','er');return}
  // Get all notifications since last digest
  const since=lastDigestDate||'1970-01-01T00:00:00Z';
  const recent=allNotifs.filter(n=>n.ts>since&&n.tab!=='budel').sort((a,b)=>a.ts.localeCompare(b.ts));
  if(!recent.length){toast('No new activity since last digest','er');return}
  // Group by actor
  const byActor={};
  recent.forEach(n=>{if(!byActor[n.actor])byActor[n.actor]=[];byActor[n.actor].push(n)});
  // Build email
  const now=new Date();
  const fromDate=lastDigestDate?new Date(lastDigestDate).toLocaleDateString('en-GB'):'beginning';
  let body='<div style="font-family:Segoe UI,sans-serif;max-width:700px;margin:0 auto">';
  body+='<div style="background:linear-gradient(135deg,#1E3A5F,#0F2439);padding:20px 24px;border-radius:12px 12px 0 0;color:#fff"><h1 style="margin:0;font-size:20px">IDB Approval Hub \u2014 Activity Digest</h1><p style="margin:6px 0 0;opacity:.7;font-size:13px">'+fromDate+' \u2192 '+now.toLocaleDateString('en-GB')+'</p></div>';
  body+='<div style="background:#fff;padding:20px 24px;border:1px solid #E5E7EB;border-top:0">';
  body+='<p style="color:#6B7280;font-size:13px;margin-bottom:16px"><b>'+recent.length+'</b> actions by <b>'+Object.keys(byActor).length+'</b> users</p>';
  // Summary counts
  const counts={approve:0,reject:0,confirm:0,return:0,comment:0,reassign:0,remind:0};
  recent.forEach(n=>{if(counts[n.action]!==undefined)counts[n.action]++});
  body+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">';
  if(counts.approve)body+='<span style="background:#D1FAE5;color:#065F46;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600">\u2705 '+counts.approve+' approved</span>';
  if(counts.reject)body+='<span style="background:#FEE2E2;color:#991B1B;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600">\u274C '+counts.reject+' rejected</span>';

  if(counts.return)body+='<span style="background:#FEF3C7;color:#92400E;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600">\u21A9 '+counts.return+' returned</span>';
  if(counts.comment)body+='<span style="background:#DBEAFE;color:#1E40AF;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600">\uD83D\uDCAC '+counts.comment+' comments</span>';
  if(counts.reassign)body+='<span style="background:#FEF3C7;color:#92400E;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600">\uD83D\uDD04 '+counts.reassign+' reassigned</span>';
  body+='</div>';
  // Per-actor breakdown
  Object.keys(byActor).sort().forEach(actor=>{
    const acts=byActor[actor];
    body+='<div style="margin-bottom:14px;border:1px solid #E5E7EB;border-radius:8px;overflow:hidden">';
    body+='<div style="background:#F9FAFB;padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid #E5E7EB">'+actor+' <span style="font-weight:400;color:#6B7280">('+acts.length+' actions)</span></div>';
    body+='<div style="padding:8px 14px">';
    acts.forEach(a=>{
      const ic=a.action==='approve'?'\u2705':a.action==='reject'?'\u274C':a.action==='confirm'?'\uD83D\uDD12':a.action==='return'?'\u21A9':a.action==='comment'?'\uD83D\uDCAC':a.action==='reassign'?'\uD83D\uDD04':'\uD83D\uDD14';
      const dt=new Date(a.ts);const ts=dt.toLocaleDateString('en-GB')+' '+dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      body+='<div style="padding:4px 0;font-size:12px;border-bottom:1px solid #F3F4F6">'+ic+' <b>#'+a.rowId+'</b> '+a.action+(a.details?' \u2014 '+a.details:'')+' <span style="color:#9CA3AF;font-size:10px">'+ts+'</span></div>';
    });
    body+='</div></div>';
  });
  // Current status summary
  const hPenAll=S.hrs.filter(d=>d.st==='Pending').length;
  const pPenAll=S.pos.filter(d=>d.st==='Pending').length;
  const hAprAll=S.hrs.filter(d=>d.st==='Approved'||d.st==='Adjusted').length;
  const pAprAll=S.pos.filter(d=>d.st==='Approved'||d.st==='Adjusted').length;

  const recip=[{emailAddress:{address:'mt@idb.sk'}},{emailAddress:{address:'vy@idb.sk'}}];
  try{

    const ts=nowISO();

    lastDigestDate=ts;
    toast('Digest sent to Marek & Viktoriia','ok');render();
  }catch(e){toast('Digest failed: '+e.message,'er');console.error(e)}
}

// PO SHEET EXPORT
function exportPOSheet(){
  const confirmed=S.hrs.filter(d=>d.fs==='Confirmed'&&(d.st==='Approved'||d.st==='Adjusted'));
  if(!confirmed.length){toast('No confirmed hours to export','er');return}
  // Group by Company → Project → Subphase
  const tree={};
  confirmed.forEach(d=>{
    const co=d.X||'Unknown';const proj=d.C||'Unknown';const projN=d.M||'';
    const sub=d.Su||'';const subN=d.B||'';const emp=d.E||'';
    if(!tree[co])tree[co]={};
    const pk=proj+'|||'+projN;
    if(!tree[co][pk])tree[co][pk]={};
    const sk=sub+'|||'+subN;
    if(!tree[co][pk][sk])tree[co][pk][sk]={hours:0,employees:new Set(),ids:[],dates:[]};
    const g=tree[co][pk][sk];
    g.hours+=(d.ah||d.Q||0);
    if(emp)g.employees.add(emp);
    g.ids.push(d.I);
    g.dates.push(d.D);
  });
  // Build workbook - one sheet per company
  const wb=XLSX.utils.book_new();
  const companies=Object.keys(tree).sort();
  companies.forEach(co=>{
    const rows=[];
    const projects=Object.keys(tree[co]).sort();
    projects.forEach(pk=>{
      const [proj,projN]=pk.split('|||');
      const subs=Object.keys(tree[co][pk]).sort();
      subs.forEach(sk=>{
        const [sub,subN]=sk.split('|||');
        const g=tree[co][pk][sk];
        const dateRange=g.dates.sort();
        rows.push({
          'Project Code':proj,
          'Project Name':projN,
          'Subphase':sub,
          'Subphase Description':subN,
          'Employee(s)':[...g.employees].join(', '),
          'Entry IDs':g.ids.join(', '),
          'Period':dateRange[0]+' - '+dateRange[dateRange.length-1],
          'Total Hours':Math.round(g.hours*100)/100,
          'Amount (€)':Math.round(g.hours*RATE*100)/100,
          'PO Number':''
        });
      });
    });
    const ws=XLSX.utils.json_to_sheet(rows);
    // Column widths
    ws['!cols']=[{wch:14},{wch:30},{wch:18},{wch:22},{wch:20},{wch:16},{wch:22},{wch:12},{wch:12},{wch:16}];
    XLSX.utils.book_append_sheet(wb,ws,co.substring(0,31));
  });
  // Summary sheet
  const summaryRows=[];
  companies.forEach(co=>{
    let coTotal=0;
    Object.keys(tree[co]).forEach(pk=>{
      Object.keys(tree[co][pk]).forEach(sk=>{coTotal+=tree[co][pk][sk].hours})
    });
    summaryRows.push({'Company':co,'Total Hours':Math.round(coTotal*100)/100,'Amount (€)':Math.round(coTotal*RATE*100)/100,'# POs needed':Object.keys(tree[co]).reduce((n,pk)=>n+Object.keys(tree[co][pk]).length,0)});
  });
  const sws=XLSX.utils.json_to_sheet(summaryRows);
  sws['!cols']=[{wch:14},{wch:14},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,sws,'Summary');
  // Download
  const now=new Date();const fn='PO_Sheet_'+now.toISOString().substring(0,10)+'.xlsx';
  XLSX.writeFile(wb,fn);
  toast('Downloaded '+fn+' ('+companies.length+' companies, '+confirmed.length+' entries)','ok');
}
window.exportPO=exportPOSheet;

  if(isAD){const ahp=S.hrs.filter(d=>d.st==='Pending').length,app=S.pos.filter(d=>d.st==='Pending').length;const newSince=allNotifs.filter(n=>n.ts>(lastDigestDate||'')&&n.tab!=='budel').length;subTabs='<div class="subtabs" style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex"><button class="subtab ad '+(S.adTab==='hours'?'on':'')+'" onclick="swAdTab(\'hours\')">Hours '+(ahp?'<span style="background:#D97706;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px">'+ahp+'</span>':'')+'</button><button class="subtab ad '+(S.adTab==='po'?'on':'')+'" onclick="swAdTab(\'po\')">Purchase Orders '+(app?'<span style="background:#D97706;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px">'+app+'</span>':'')+'</button><button class="subtab ad '+(S.adTab==='budel'?'on':'')+'" onclick="swAdTab(\'budel\')">Budel '+(S.bud.filter(d=>d.st==='Pending').length?'<span style="background:#D97706;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px">'+S.bud.filter(d=>d.st==='Pending').length+'</span>':'')+'</button></div><div style="padding:4px 16px;display:flex;align-items:center;gap:8px">'+(lastDigestDate?'<span style="font-size:10px;color:#6B7280">Last digest: '+new Date(lastDigestDate).toLocaleDateString('en-GB')+'</span>':'')+'<button onclick="sendDigest()" style="padding:5px 14px;border-radius:6px;border:0;background:linear-gradient(135deg,#4F46E5,#6366F1);color:#fff;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px">\uD83D\uDCE7 Send Digest'+(newSince?' <span style="background:rgba(255,255,255,.3);padding:1px 6px;border-radius:8px;font-size:9px">'+newSince+'</span>':'')+'</button></div></div>'}
  const aprFilter=showApr&&aprO.length?'<div class="fg"><label>Assignee</label><select class="'+(f.apr!=='All'?'af':'')+'" onchange="setF(\'apr\',this.value)"><option value="All">All</option>'+aprO.map(o=>'<option'+(f.apr===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div>':'';
  el.innerHTML='<div class="hd"><div style="display:flex;align-items:center;gap:14px"><img src="'+LOGO_STM+'" style="height:28px;opacity:.9"><div style="width:1px;height:24px;background:rgba(255,255,255,.2)"></div><img src="'+LOGO_IDB+'" style="height:26px;border-radius:5px"><h1 style="font-size:15px">Approval Hub</h1></div><div style="display:flex;align-items:center;gap:8px">'+snBtn+'<button onclick="doRef()" style="background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11px">\u21BB</button><div style="position:relative"><button style="position:relative;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px" onclick="tNotif()">\uD83D\uDD14'+(allNotifs.length?'<span style="position:absolute;top:-4px;right:-4px;background:#EF4444;color:#fff;font-size:9px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center">'+Math.min(allNotifs.length,99)+'</span>':'')+'</button>'+np+'</div><div class="umenu"><div style="display:flex;align-items:center;gap:8px;padding:4px 0"><div style="text-align:right"><div style="font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase">'+roleLabel+'</div><div style="font-size:12px;font-weight:600">'+usr+'</div></div><div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,'+roleColor+');display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">'+ini+'</div></div><div class="udrop"><a href="#">\uD83D\uDC64 '+usr+'</a><a href="#" onclick="doSignOut();return false">\u2715 Sign out</a></div></div></div></div>'+'<div class="tabs"><button class="tab '+(S.tab==='hours'?'on':'')+'" onclick="swTab(\'hours\')">Worked Hours '+(hPen?'<span class="tbg">'+hPen+'</span>':'')+'</button><button class="tab '+(S.tab==='po'?'on':'')+'" onclick="swTab(\'po\')">Purchase Orders '+(pPen?'<span class="tbg">'+pPen+'</span>':'')+'</button>'+(bFid?'<button class="tab '+(S.tab==='budel'?'on':'')+'" onclick="swTab(\'budel\')">Ing. Budel '+(bPen?'<span class="tbg">'+bPen+'</span>':'')+'</button>':'')+(isFinal?'<button class="tab '+(S.tab==='signoff'?'on':'')+'" onclick="swTab(\'signoff\')" style="'+(isSO?'border-bottom-color:#8B5CF6':'')+'">\uD83D\uDD12 Sign-Off '+(soTotal?'<span class="tbg so">'+soTotal+'</span>':'')+'</button>':'')+(canAdmin?'<button class="tab '+(S.tab==='admin'?'on':'')+'" onclick="swTab(\'admin\')" style="'+(isAD?'border-bottom-color:#D97706':'')+'">\u2699 Admin '+(adPen?'<span class="tbg ad">'+adPen+'</span>':'')+'</button>':'')+'</div>'+subTabs+'<div class="sts" style="grid-template-columns:repeat('+stA.length+',1fr)">'+stA.map(s=>'<div class="st '+(S.sf===s.k||(s.k===null&&!S.sf)?'on':'')+'" style="--ac:'+s.a+'" onclick="cSt('+(s.k?"\'"+s.k+"\'":"null")+')"><div class="sl">'+s.l+'</div><div class="sv">'+s.v+' entries</div><div class="sa">'+eur(s.hrs*curRate)+'</div><div class="sh2">'+s.hrs.toFixed((isH||isB)?1:0)+'h</div></div>').join('')+'</div>'+pc+'<div class="fb">'+((isH||isB)?'<div class="fg"><label>Month</label><select class="'+(f.mo!=='All'?'af':'')+'" onchange="setF(\'mo\',this.value)"><option value="All">All</option>'+mO.map(m=>'<option value="'+m.v+'"'+(f.mo===m.v?' selected':'')+'>'+m.l+'</option>').join('')+'</select></div>':'')+'<div class="fg"><label>Company</label><select class="'+(f.co!=='All'?'af':'')+'" onchange="setF(\'co\',this.value)"><option value="All">All</option>'+cO.map(o=>'<option value="'+(o||'None')+'"'+(f.co===(o||'None')?' selected':'')+'>'+(o||'None')+'</option>').join('')+'</select></div><div class="fg"><label>'+((isH||isB)?'Code':'Proj#')+'</label><select class="'+(f.cd!=='All'?'af':'')+'" onchange="setF(\'cd\',this.value)"><option value="All">All</option>'+cdO.map(o=>'<option value="'+o+'"'+(f.cd===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="fg"><label>Project</label><select class="'+(f.pr!=='All'?'af':'')+'" onchange="setF(\'pr\',this.value)" style="max-width:160px"><option value="All">All</option>'+pO.map(o=>'<option'+(f.pr===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="fg"><label>'+((isH||isB)?'Subphase':'Sub')+'</label><select class="'+(f.sp!=='All'?'af':'')+'" onchange="setF(\'sp\',this.value)" style="max-width:140px"><option value="All">All</option>'+spO.map(o=>'<option value="'+o+'"'+(f.sp===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="fg"><label>'+((isH||isB)?'Employee':'Engineer')+'</label><select class="'+(f.em!=='All'?'af':'')+'" onchange="setF(\'em\',this.value)" style="min-width:100px"><option value="All">All</option>'+eO.map(o=>'<option'+(f.em===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="fg"><label>Status</label><select class="'+(es!=='All'?'af':'')+'" onchange="setF(\'st\',this.value);S.sf=null"><option value="All">All</option>'+sts.map(o=>'<option'+(es===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'+aprFilter+'<button onclick="tCmt()" style="padding:5px 10px;border-radius:6px;border:1px solid '+(f.cmt?'#3B82F6':'#D1D5DB')+';background:'+(f.cmt?'#DBEAFE':'#fff')+';font-size:10px;font-weight:600;cursor:pointer;color:'+(f.cmt?'#1E40AF':'#6B7280')+'">\uD83D\uDCAC Comments</button>'+(anyF?'<button onclick="resF()" style="padding:5px 8px;border-radius:6px;border:0;background:#FEE2E2;color:#991B1B;font-size:10px;font-weight:600;cursor:pointer">Reset</button>':'')+'</div>'+(selP&&!isAdmin?(isSO?'<div style="padding:6px 20px 0;display:flex;gap:6px;align-items:center;font-size:11px;color:#888">'+selP+' selected <button onclick="doBConfirm()" style="padding:5px 12px;border-radius:6px;border:0;background:#8B5CF6;color:#fff;font-size:11px;font-weight:600;cursor:pointer">\uD83D\uDD12 Confirm All</button></div>':'<div style="padding:6px 20px 0;display:flex;gap:6px;align-items:center;font-size:11px;color:#888">'+selP+' selected <button onclick="doB()" style="padding:5px 12px;border-radius:6px;border:0;background:#059669;color:#fff;font-size:11px;font-weight:600;cursor:pointer">Approve All</button></div>'):'')+'<div style="padding:10px 20px 20px"><div style="background:#fff;border-radius:10px;border:1px solid #E5E7EB;overflow:hidden"><div style="overflow-x:auto"><table><thead><tr>'+thR+'</tr></thead><tbody>'+rows+'</tbody></table></div><div style="padding:12px 16px;border-top:2px solid #E5E7EB;background:#F9FAFB;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:#6B7280">'+fi.length+' of '+md.length+'</span><div style="display:flex;gap:20px"><div style="text-align:right"><div style="font-size:9px;color:#6B7280;text-transform:uppercase;font-weight:600">Requested</div><div style="font-weight:800;font-family:monospace;color:#111">'+reqH.toFixed((isH||isB)?2:0)+'h \u00b7 <span style="color:#F59E0B">'+eur(reqH*curRate)+'</span></div></div><div style="text-align:right"><div style="font-size:9px;color:#059669;text-transform:uppercase;font-weight:600">Approved</div><div style="font-weight:800;font-family:monospace;color:#059669">'+aprH2.toFixed((isH||isB)?2:0)+'h \u00b7 '+eur(aprH2*curRate)+'</div></div></div></div></div></div>'+'<div id="ov" class="ov '+(S.det?'open':'')+'" onclick="cDet()"><div class="sb" onclick="event.stopPropagation()"><div style="padding:20px 22px" id="sbc"></div></div></div>';
  if(S.det)renderSB();
}

function renderSB(){
  const d=S.det;if(!d)return;
  const isH=d.id.startsWith('H')||d.id.startsWith('B'),isB=d.id.startsWith('B'),pen=d.st==='Pending',req=d.Q,sbRate=isB?RATE_BUDEL:RATE;
  const isSO=S.tab==='signoff',isAD=S.tab==='admin';
  let flds;
  if(isB)flds='<p><b>Engineer:</b> '+d.E+'</p><p><b>Date:</b> '+d.D+'</p><p><b>Requested:</b> '+d.Q.toFixed(2)+'h ('+eur(d.Q*sbRate)+')</p><p style="margin-top:8px;padding-top:8px;border-top:1px solid #eee"><b>Project:</b> '+d.M+'</p><p><b>Code:</b> <span style="font-family:monospace;font-weight:700;color:#059669">'+d.C+'</span></p><p><b>Company:</b> '+d.Z+'</p>'+(d.B?'<p><b>Subphase:</b> '+d.B+'</p>':'')+(d.W?'<p><b>Task:</b> <span style="font-size:11px">'+d.W+'</span></p>':'')+'<p><b>Assigned to:</b> '+aprBdg(d.AF)+'</p>';
  else if(!isB&&isH)flds='<p><b>Employee:</b> '+d.E+' ('+d.N+')</p><p><b>Date:</b> '+d.D+' | '+d.T+' - '+d.U+'</p><p><b>Requested:</b> '+d.Q.toFixed(2)+'h ('+eur(d.Q*sbRate)+')</p><p style="margin-top:8px;padding-top:8px;border-top:1px solid #eee"><b>Project:</b> '+d.M+'</p><p><b>Code:</b> <span style="font-family:monospace;font-weight:700;color:#4F46E5">'+d.C+'</span></p><p><b>Subphase:</b> '+d.B+' <span style="color:#6B7280;font-size:11px">('+d.Su+')</span></p><p><b>Work:</b> '+d.W+'</p><p><b>Assigned to:</b> '+aprBdg(d.AF)+'</p>';
  else flds='<p><b>Company:</b> '+d.Z+'</p><p style="margin-top:8px;padding-top:8px;border-top:1px solid #eee"><b>Project:</b> '+d.J+'</p><p><b>Project #:</b> <span style="font-family:monospace;font-weight:700;color:#8B5CF6">'+d.PN+'</span></p>'+(d.Sp?'<p><b>Subphase:</b> '+d.Sp+' <span style="color:#6B7280;font-size:11px">('+d.SD+')</span></p>':'')+'<p><b>Task:</b> '+d.A+'</p><p><b>Engineer:</b> '+d.G+'</p><p><b>Timeline:</b> '+d.F+' to '+d.Y2+'</p><p><b>Requested:</b> '+d.Q+'h ('+eur(d.Q*sbRate)+')</p><p><b>Assigned to:</b> '+aprBdg(d.OB)+'</p>';
  if(!pen&&d.sb){flds+='<hr style="border:0;border-top:1px solid #eee;margin:8px 0"><p><b>Status:</b> '+bdg(d.st)+'</p><p><b>Approved:</b> '+(isH?(d.ah!=null?d.ah.toFixed(2):'--')+'h':(d.aq!=null?d.aq:'--')+'h')+'</p><p><b>By:</b> '+aprBdg(d.sb)+'</p>';if(d.ad)flds+='<p><b>At:</b> '+fmtDT(d.ad)+'</p>'}
  if(d.fs)flds+='<hr style="border:0;border-top:1px solid #eee;margin:8px 0"><p><b>Final:</b> '+bdg(d.fs)+'</p><p><b>Signed:</b> '+d.fsb+'</p>';
  const pct=req>0?S.adj/req*100:100,diff=req-S.adj,isR=diff>.005;
  const showAdj=pen&&!isAdmin&&(S.tab==='hours'||S.tab==='po'||S.tab==='budel'||isAD);
  const adjH=showAdj?'<div class="adj"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:11px;font-weight:600">Adjustment</span>'+(isR?'<span style="font-size:10px;color:#DC2626;background:#FEE2E2;padding:1px 6px;border-radius:6px;font-weight:600">-'+diff.toFixed(2)+'</span>':'<span style="font-size:10px;color:#059669;background:#D1FAE5;padding:1px 6px;border-radius:6px;font-weight:600">Full</span>')+'</div><div class="adjbar" style="background:'+(isR?'#FEE2E2':'#F3F4F6')+'"><div class="adjfill" style="width:'+Math.min(pct,100)+'%"></div><div class="adjtx">'+S.adj.toFixed(2)+'h ('+eur(S.adj*sbRate)+')</div></div><input type="range" min="0" max="'+req*100+'" value="'+S.adj*100+'" oninput="sAdj(parseInt(this.value)/100)" style="width:100%;accent-color:#3B82F6;cursor:pointer;margin-bottom:4px"><div style="display:flex;gap:6px"><input type="number" min="0" step="0.25" value="'+S.adj+'" style="flex:1;padding:6px;border-radius:6px;border:1px solid #D1D5DB;font-size:13px;font-weight:700;font-family:monospace;box-sizing:border-box" oninput="const v=parseFloat(this.value);if(!isNaN(v)&&v>=0)sAdj(v)">'+[100,75,50].map(n=>'<button style="padding:6px 8px;border-radius:6px;border:1px solid #D1D5DB;background:'+(Math.abs(S.adj-req*n/100)<.01?'#D1FAE5':'#fff')+';font-size:10px;font-weight:600;cursor:pointer" onclick="sAdj(Math.round('+req+'*'+n+')/100)">'+n+'%</button>').join('')+'</div></div><div style="margin-top:10px"><textarea id="dcm" placeholder="Comment..." style="width:100%;min-height:36px;border-radius:6px;border:1px solid #D1D5DB;padding:6px;font-size:12px;font-family:inherit;box-sizing:border-box;resize:vertical">'+S.cmt+'</textarea><div style="display:flex;gap:6px;margin-top:6px"><button onclick="doA()" style="flex:1;padding:9px;border-radius:8px;border:0;background:#059669;color:#fff;font-size:12px;font-weight:600;cursor:pointer">Approve '+S.adj.toFixed(isH?2:0)+'h</button><button onclick="doR()" style="flex:1;padding:9px;border-radius:8px;border:0;background:#DC2626;color:#fff;font-size:12px;font-weight:600;cursor:pointer">'+(isH?'Reject':'Disapprove')+'</button></div></div>':'';
  const soH=isSO&&isFinal?'<div style="margin-top:14px;display:flex;gap:6px"><button onclick="doConfirm(\''+d.id+'\')" style="flex:1;padding:9px;border-radius:8px;border:0;background:#8B5CF6;color:#fff;font-size:12px;font-weight:600;cursor:pointer">\uD83D\uDD12 Confirm</button><button onclick="doReturn(\''+d.id+'\')" style="flex:1;padding:9px;border-radius:8px;border:0;background:#F59E0B;color:#fff;font-size:12px;font-weight:600;cursor:pointer">\u21A9 Return</button></div>':'';
  document.getElementById('sbc').innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h2 style="font-size:16px">'+(isH?'#'+d.I:'PO-'+d.I)+'</h2><button onclick="cDet()" style="background:0;border:0;font-size:18px;cursor:pointer;color:#aaa">\u2715</button></div><div style="margin-bottom:12px">'+bdg(d.st)+'</div><div style="font-size:12px;line-height:1.8">'+flds+'</div>'+adjH+soH;
}

// INIT
(async()=>{
  await msalApp.initialize();
  const resp=await msalApp.handleRedirectPromise();
  if(resp){tk=resp.accessToken;usr=resp.account.name||resp.account.username;usrMail=(resp.account.username||'').toLowerCase();isAdmin=ADMINS.includes(usrMail);isFinal=usrMail===FINAL_APPROVER;isSenior=SENIORS.includes(usrMail);canAdmin=isFinal||isSenior;await loadData();return}
  if(msalApp.getAllAccounts().length>0){const t=await getTk();if(t){await loadData();return}}
  S.phase='login';render();
})();
</script>
